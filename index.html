<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropiShare - Calculadora de Propinas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', sans-serif;
      padding: 40px 20px;
    }

    .titulo {
      font-weight: bold;
      font-size: 3rem;
      color: #7c3aed;
      margin-bottom: 40px;
      position: relative;
      display: inline-block;
    }

    .titulo::before {
      content: '';
      position: absolute;
      inset: 0;
      background: hsl(260, 100%, 85%);
      z-index: -1;
      transform: scaleX(0);
      transform-origin: bottom right;
      transition: transform 0.3s ease;
      border-radius: 8px;
    }

    .titulo:hover::before {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    .card {
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .form-control {
      border-radius: 10px;
    }

    .btn-calcular {
      background-color: #7c3aed;
      color: white;
      border-radius: 10px;
    }

    .btn-calcular:hover {
      background-color: #5b21b6;
    }

    table {
      margin-top: 30px;
    }

    th {
      background-color: #7c3aed;
      color: white;
    }

    .nota-sobrante {
      font-size: 0.95rem;
      margin-top: 15px;
    }

    .sub-decimal {
      font-size: 0.9rem;
      color: #888;
    }

    @media (max-width: 576px) {
      .titulo {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="text-center">
      <h1 class="titulo">PropiShare</h1>
    </div>

    <div class="card p-4">
      <div class="mb-3">
        <label for="dineroTotal" class="form-label">Cantidad de Dinero a Dividir</label>
        <input type="number" class="form-control" id="dineroTotal" min="1" value="100">
      </div>

      <div class="mb-3">
        <label for="numEmpleados" class="form-label">Número de Empleados</label>
        <input type="number" class="form-control" id="numEmpleados" min="1" value="1" onchange="crearInputsEmpleados()">
      </div>

      <div id="empleadosContainer"></div>

      <div class="d-grid mt-3">
        <button class="btn btn-calcular" onclick="calcularPropina()">Calcular Propinas</button>
      </div>
    </div>

    <div id="tablaResultado" class="table-responsive">
      <table class="table table-bordered mt-4">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Días Trabajados</th>
            <th>Propina</th>
          </tr>
        </thead>
        <tbody id="resultadoCuerpo"></tbody>
      </table>
      <div id="notaSobrante" class="alert alert-info nota-sobrante d-none"></div>
    </div>
  </div>

  <script>
    function crearInputsEmpleados() {
      const num = parseInt(document.getElementById("numEmpleados").value);
      const container = document.getElementById("empleadosContainer");
      container.innerHTML = "";

      for (let i = 0; i < num; i++) {
        const row = document.createElement("div");
        row.classList.add("row", "mb-2");

        const colNombre = document.createElement("div");
        colNombre.className = "col-sm-6 mb-2 mb-sm-0";
        const inputNombre = document.createElement("input");
        inputNombre.className = "form-control";
        inputNombre.type = "text";
        inputNombre.placeholder = `Nombre Empleado ${i + 1}`;
        colNombre.appendChild(inputNombre);

        const colDias = document.createElement("div");
        colDias.className = "col-sm-6";
        const inputDias = document.createElement("input");
        inputDias.className = "form-control";
        inputDias.type = "number";
        inputDias.min = "1";
        inputDias.placeholder = "Días trabajados";
        colDias.appendChild(inputDias);

        row.appendChild(colNombre);
        row.appendChild(colDias);
        container.appendChild(row);
      }
    }

    function calcularPropina() {
      const total = parseFloat(document.getElementById("dineroTotal").value);
      const inputs = document.querySelectorAll("#empleadosContainer input");
      const tbody = document.getElementById("resultadoCuerpo");
      const notaSobrante = document.getElementById("notaSobrante");
      tbody.innerHTML = "";
      notaSobrante.classList.add("d-none");

      let totalDias = 0;
      const empleados = [];

      for (let i = 0; i < inputs.length; i += 2) {
        const nombre = inputs[i].value || `Empleado ${i / 2 + 1}`;
        const dias = parseInt(inputs[i + 1].value) || 0;
        totalDias += dias;
        empleados.push({ nombre, dias });
      }

      const propinaPorDia = total / totalDias;
      let totalAsignado = 0;

      const filas = empleados.map(emp => {
        const exacta = emp.dias * propinaPorDia;
        const redondeada = Math.round(exacta);
        totalAsignado += redondeada;
        return {
          nombre: emp.nombre,
          dias: emp.dias,
          redondeada,
          exacta: exacta.toFixed(2)
        };
      });

      filas.forEach(f => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${f.nombre}</td>
          <td>${f.dias}</td>
          <td>$${f.redondeada} <span class="sub-decimal">($${f.exacta})</span></td>
        `;
        tbody.appendChild(fila);
      });

      const sobrante = (total - totalAsignado).toFixed(2);
      if (sobrante != 0) {
        const texto = sobrante === "1.00"
          ? `Se redondearon los valores al peso más cercano. Queda $1 sin repartir que volverá a la alcancía.`
          : `Se redondearon los valores al peso más cercano. Quedan $${sobrante} sin repartir que volverán a la alcancía.`;
        notaSobrante.textContent = texto;
        notaSobrante.classList.remove("d-none");
      } else {
        notaSobrante.textContent = `Se redondearon los valores al peso más cercano. Todos los pesos fueron distribuidos.`;
        notaSobrante.classList.remove("d-none");
      }
    }

    window.onload = crearInputsEmpleados;
  </script>
</body>

</html>
