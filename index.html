<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropiShare - Calculadora de Propinas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', sans-serif;
      padding: 40px 20px;
    }

    .titulo {
      font-weight: bold;
      font-size: 3rem;
      color: #7c3aed;
      margin-bottom: 40px;
      position: relative;
      display: inline-block;
    }

    .titulo::before {
      content: '';
      position: absolute;
      inset: 0;
      background: hsl(260, 100%, 85%);
      z-index: -1;
      transform: scaleX(0);
      transform-origin: bottom right;
      transition: transform 0.3s ease;
      border-radius: 8px;
    }

    .titulo:hover::before {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    .card {
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    .form-control {
      border-radius: 10px;
    }

    .form-control.is-invalid {
      border-color: #dc3545;
      box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
    }

    .btn-calcular {
      background-color: #7c3aed;
      color: white;
      border-radius: 10px;
    }

    .btn-calcular:hover {
      background-color: #5b21b6;
    }

    .separador-empleado {
      border-bottom: 1px solid #dee2e6;
      margin: 10px 0;
      display: none;
    }

    @media (max-width: 576px) {
      .separador-empleado {
        display: block;
      }
    }

    .nota-sobrante {
      font-size: 0.95rem;
      margin-top: 15px;
    }

    .sub-decimal {
      font-size: 0.9rem;
      color: #888;
    }

    .gestionar-empleados-box,
    .pdf-box {
      border: 1px solid #dee2e6;
      border-radius: 12px;
      padding: 15px;
      background-color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      min-width: 180px;
    }

    .gestionar-empleados-box h6 {
      font-weight: 600;
      margin-bottom: 10px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .d-flex.flex-md-row {
        flex-direction: row !important;
        align-items: flex-start;
        flex-wrap: nowrap;
      }

      .gestionar-empleados-box,
      .pdf-box {
        margin-left: 10px;
        margin-top: 0;
        padding: 10px;
        min-width: auto;
      }

      .gestionar-empleados-box .btn,
      .pdf-box .btn {
        width: 100%;
      }

      .gestionar-empleados-box h6 {
        font-size: 0.9rem;
        margin-bottom: 6px;
      }
    }

    .columna-derecha {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-left: 20px;
    }

    @media (max-width: 768px) {
      .columna-derecha {
        margin-left: 0;
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container" id="contenedorPrincipal">
    <div class="text-center">
      <h1 class="titulo">PropiShare</h1>
    </div>

    <div class="d-flex flex-column flex-md-row align-items-start">
      <!-- Bloque izquierdo -->
      <div class="card p-4 flex-grow-1">
        <div class="mb-3">
          <label for="dineroTotal" class="form-label">Cantidad de Dinero a Dividir</label>
          <input type="number" class="form-control" id="dineroTotal" min="1" value="100">
        </div>

        <div id="empleadosContainer"></div>

        <div class="d-grid mt-3">
          <button class="btn btn-calcular" onclick="calcularPropina()">Calcular Propinas</button>
        </div>
      </div>

      <!-- Columna derecha -->
      <div class="columna-derecha">
        <div class="gestionar-empleados-box d-flex flex-column align-items-center">
          <h6>👥 Gestionar empleados</h6>
          <div class="d-grid gap-2 w-100 mb-2">
            <button class="btn btn-outline-success" onclick="agregarEmpleado()">+ Agregar</button>
            <button class="btn btn-outline-danger" onclick="quitarEmpleado()" id="btnQuitar">− Quitar</button>
          </div>
        </div>

        <div class="pdf-box text-center">
          <button class="btn btn-outline-secondary w-100" onclick="descargarPDF()">Descargar en PDF</button>
        </div>
      </div>
    </div>

    <div id="tablaResultado" class="table-responsive mt-3">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Días Trabajados</th>
            <th>Propina</th>
          </tr>
        </thead>
        <tbody id="resultadoCuerpo"></tbody>
      </table>
      <div id="notaSobrante" class="alert alert-info nota-sobrante d-none"></div>
    </div>
  </div>

  <script>
    let empleadosCount = 0;

    function actualizarBotonQuitar() {
      const btnQuitar = document.getElementById("btnQuitar");
      btnQuitar.disabled = empleadosCount <= 1;
    }

    function agregarEmpleado() {
      empleadosCount++;
      const container = document.getElementById("empleadosContainer");

      const separador = document.createElement("div");
      separador.className = "separador-empleado";
      container.appendChild(separador);

      const row = document.createElement("div");
      row.className = "row mb-2 fila-empleado";

      const colNombre = document.createElement("div");
      colNombre.className = "col-sm-6 mb-2 mb-sm-0";
      const inputNombre = document.createElement("input");
      inputNombre.className = "form-control";
      inputNombre.type = "text";
      inputNombre.placeholder = `Nombre Empleado ${empleadosCount}`;
      inputNombre.addEventListener("input", () => inputNombre.classList.remove("is-invalid"));
      colNombre.appendChild(inputNombre);

      const colDias = document.createElement("div");
      colDias.className = "col-sm-6";
      const inputDias = document.createElement("input");
      inputDias.className = "form-control";
      inputDias.type = "number";
      inputDias.min = "1";
      inputDias.placeholder = "Días trabajados";
      inputDias.addEventListener("input", () => inputDias.classList.remove("is-invalid"));
      colDias.appendChild(inputDias);

      row.appendChild(colNombre);
      row.appendChild(colDias);
      container.appendChild(row);

      actualizarBotonQuitar();
    }

    function quitarEmpleado() {
      const container = document.getElementById("empleadosContainer");
      if (container.lastChild) container.removeChild(container.lastChild);
      if (container.lastChild && container.lastChild.classList.contains("separador-empleado")) {
        container.removeChild(container.lastChild);
      }
      if (empleadosCount > 0) empleadosCount--;
      actualizarBotonQuitar();
    }

    function calcularPropina() {
      const total = parseFloat(document.getElementById("dineroTotal").value);
      const inputs = document.querySelectorAll("#empleadosContainer input");
      const tbody = document.getElementById("resultadoCuerpo");
      const notaSobrante = document.getElementById("notaSobrante");
      tbody.innerHTML = "";
      notaSobrante.classList.add("d-none");

      let totalDias = 0;
      const empleados = [];
      let validacionFallida = false;

      for (let i = 0; i < inputs.length; i += 2) {
        const nombreInput = inputs[i];
        const diasInput = inputs[i + 1];
        const nombre = nombreInput.value.trim();
        const dias = parseInt(diasInput.value);

        if (!nombre || isNaN(dias) || dias <= 0) {
          nombreInput.classList.toggle("is-invalid", !nombre);
          diasInput.classList.toggle("is-invalid", isNaN(dias) || dias <= 0);
          validacionFallida = true;
          continue;
        }

        totalDias += dias;
        empleados.push({ nombre, dias });
      }

      if (validacionFallida || totalDias === 0 || isNaN(total) || total <= 0) {
        return;
      }

      const propinaPorDia = total / totalDias;
      let totalAsignado = 0;

      const filas = empleados.map(emp => {
        const exacta = emp.dias * propinaPorDia;
        const redondeada = Math.floor(exacta);
        totalAsignado += redondeada;
        return {
          nombre: emp.nombre,
          dias: emp.dias,
          redondeada,
          exacta: exacta.toFixed(2)
        };
      });

      filas.forEach(f => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${f.nombre}</td>
          <td>${f.dias}</td>
          <td>$${f.redondeada} <span class="sub-decimal">($${f.exacta})</span></td>
        `;
        tbody.appendChild(fila);
      });

      const sobrante = total - totalAsignado;
      const sobranteMostrar = sobrante.toFixed(2);
      if (sobrante > 0) {
        const texto = sobranteMostrar === "1.00"
          ? `Se redondearon los valores al peso más cercano. Queda $1 sin repartir que volverá a la alcancía.`
          : `Se redondearon los valores al peso más cercano. Quedan $${sobranteMostrar} sin repartir que volverán a la alcancía.`;
        notaSobrante.textContent = texto;
        notaSobrante.classList.remove("d-none");
      } else {
        notaSobrante.textContent = `Se redondearon los valores al peso más cercano. Todos los pesos fueron distribuidos.`;
        notaSobrante.classList.remove("d-none");
      }
    }

    function descargarPDF() {
      const element = document.getElementById("tablaResultado");
      const fecha = new Date().toLocaleDateString('es-UY');
      const opt = {
        margin: 0.5,
        filename: `Propina ${fecha}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    window.onload = () => {
      agregarEmpleado();
    };
  </script>
</body>

</html>
